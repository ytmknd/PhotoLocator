<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo GPS Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="layout">
      <section class="card hero">
        <h1>Photo GPS Viewer</h1>
        <p class="lead">画像をドラッグ＆ドロップして、EXIFの位置情報を表示します。</p>

        <label id="drop-zone" class="drop-zone" for="file-input" aria-label="画像をドロップまたは選択">
          <input id="file-input" type="file" accept="image/*" />
          <span class="drop-title">ここに画像をドロップ</span>
          <span class="drop-sub">またはクリックして選択</span>
        </label>

        <p id="status" class="status" aria-live="polite">画像を選択してください。</p>
      </section>

      <section class="card result">
        <div class="preview-wrap">
          <img id="preview" alt="選択した画像のプレビュー" />
        </div>

        <dl class="meta" id="meta-list">
          <div class="meta-row">
            <dt>ファイル名</dt>
            <dd id="file-name">-</dd>
          </div>
          <div class="meta-row">
            <dt>緯度</dt>
            <dd id="latitude">-</dd>
          </div>
          <div class="meta-row">
            <dt>経度</dt>
            <dd id="longitude">-</dd>
          </div>
          <div class="meta-row">
            <dt>高度</dt>
            <dd id="altitude">-</dd>
          </div>
          <div class="meta-row">
            <dt>撮影日時</dt>
            <dd id="captured-at">-</dd>
          </div>
        </dl>

        <div class="actions">
          <a id="map-link" href="#" target="_blank" rel="noopener noreferrer" class="btn disabled" aria-disabled="true">地図で開く</a>
        </div>
      </section>
    </main>
  </body>
</html>
